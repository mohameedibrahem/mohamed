<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohamed Ibrahim | Sales Manager | Golden Palm Real Estate</title>
  <meta name="description" content="Mohamed Ibrahim — Sales Manager at Golden Palm Real Estate." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Montserrat", sans-serif;
      background: #061812;
      color: #fff;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(200,161,74,0.08) 0%, transparent 50%),
        linear-gradient(165deg, #061812 0%, #0a1a14 100%);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 390px;
      background: #0B1F18;
      border: 1.5px solid rgba(200, 161, 74, 0.45);
      border-radius: 28px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(200,161,74,0.15);
      overflow: hidden;
    }

    .card-inner {
      padding: 32px 24px 28px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      max-height: 148px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    .divider {
      height: 1px;
      margin: 20px 0;
      background: rgba(200, 161, 74, 0.35);
    }

    .photo-wrap {
      position: relative;
      padding-right: 12px;
    }

    .photo-frame {
      position: relative;
      overflow: hidden;
      border-radius: 0 44px 0 0;
      border: 1px solid rgba(200, 161, 74, 0.45);
      border-bottom: none;
      border-left: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C8A14A 20%, #D4B05C 50%, #C8A14A 80%, transparent);
      z-index: 2;
    }

    .photo-frame::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, #D4B05C, rgba(139,115,64,0.5));
      z-index: 2;
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 4.5;
      object-fit: cover;
      object-position: center 18%;
    }

    .identity {
      text-align: center;
      margin-top: 28px;
      padding: 0 8px;
    }

    .name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2.05rem;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .name-first { color: #C8A14A; font-weight: 700; }
    .name-last  { color: #fff; font-weight: 400; }

    .title {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(255,255,255,0.92);
      margin-bottom: 4px;
    }

    .contacts {
      position: relative;
      margin-top: 8px;
    }

    .contacts::after {
      content: "";
      position: absolute;
      right: 5px;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: rgba(200,161,74,0.35);
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 10px 0;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .contact-row:hover { opacity: 0.85; }

    .icon-box {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(200,161,74,0.55);
      border-radius: 6px;
      background: rgba(200,161,74,0.06);
    }

    .icon-box svg {
      width: 18px;
      height: 18px;
      stroke: #D4B05C;
      fill: none;
      stroke-width: 1.5;
    }

    .contact-text { flex: 1; min-width: 0; padding-top: 2px; }

    .contact-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8B7340;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .contact-value {
      font-size: 14px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      word-break: break-all;
    }

    .timeline-dot {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      margin-top: 10px;
      background: #C8A14A;
      transform: rotate(45deg);
      opacity: 0.85;
    }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 28px;
      padding: 14px 24px;
      border: 1.5px solid rgba(200,161,74,0.65);
      border-radius: 999px;
      background: transparent;
      color: #C8A14A;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 0.3s, transform 0.2s;
    }

    .save-btn:hover {
      box-shadow: 0 0 24px rgba(200,161,74,0.15);
      transform: scale(1.01);
    }

    .save-btn svg {
      width: 16px;
      height: 16px;
      stroke: #C8A14A;
      fill: none;
      stroke-width: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(168,181,173,0.4);
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>

  <article class="card">
    <div class="card-inner">
      <img
        class="logo"
        src="logo.png"
        alt="Golden Palm Real Estate"
      />

      <div class="divider"></div>

      <div class="photo-wrap">
        <div class="photo-frame">
          <img
            class="photo"
            src="photo.jpg"
            alt="Mohamed Ibrahim"
          />
        </div>
      </div>

      <div class="identity">
        <h1 class="name">
          <span class="name-first">Mohamed</span> <span class="name-last">Ibrahim</span>
        </h1>
        <p class="title">Sales Manager</p>
      </div>

      <div class="divider"></div>

      <div class="contacts">
        <a class="contact-row" href="https://wa.me/971551020052">
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div class="contact-text">
            <div class="contact-label">Mobile / WhatsApp</div>
            <div class="contact-value" dir="ltr">+971 55 102 0052</div>
          </div>
          <div class="timeline-dot"></div>
        </a>

        <a class="contact-row" href="https://goldenpalm-realestate.com" target="_blank" rel="noopener">
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="contact-text">
            <div class="contact-label">Website</div>
            <div class="contact-value" dir="ltr">goldenpalm-realestate.com</div>
          </div>
          <div class="timeline-dot"></div>
        </a>
      </div>

      <a class="save-btn" id="saveContact" href="#">
        <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Save Contact
      </a>

      <p class="footer">Abu Dhabi · UAE</p>
    </div>
  </article>

  <script>
    document.getElementById("saveContact").addEventListener("click", function (e) {
      e.preventDefault();
      var vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:Mohamed Ibrahim",
        "N:Ibrahim;Mohamed;;;",
        "TITLE:Sales Manager",
        "ORG:Golden Palm Real Estate",
        "TEL;TYPE=CELL:+971551020052",
        "URL:https://goldenpalm-realestate.com",
        "END:VCARD"
      ].join("\r\n");

      var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Mohamed_Ibrahim.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
